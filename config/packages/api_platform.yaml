api_platform:
    title: Hello API Platform
    version: 1.0.0
    show_webby: false

    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

        # Pagination configuration
        pagination_client_enabled: true
        pagination_client_items_per_page: true
        # Disable counting items in collections, activate it for large collections, it removes the "last" link in the pagination
        # pagination_partial: true

        # Subresources configuration
        enable_link_security: true

        # Enable denormalization errors of incoming data for all resources
        collectDenormalizationErrors: true
    collection:
      pagination:
        enabled_parameter_name: pagination
        items_per_page_parameter_name: itemsPerPage

    swagger:
      api_keys:
        JWT:
          name: Authorization
          type: header
        API_KEY:
          name: x-api-key
          type: header

      swagger_ui_extra_configuration:
        persistAuthorization: true
        filter: true
        docExpansion: none
        operationsSorter: method
        defaultModelsExpandDepth: -1


